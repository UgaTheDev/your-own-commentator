    </div>
  </div>

    <div style="position:absolute;left:30%;top:47%;width:2.6%;height:17%;border-radius:999px;background:linear-gradient(180deg,#f06aa6,#d6247a 40%,#8a1450);"></div>
    <div style="position:absolute;left:38%;top:51%;width:2.8%;height:18%;border-radius:999px;background:linear-gradient(180deg,#f06aa6,#d6247a 40%,#8a1450);"></div>

    <div style="position:absolute;left:34%;top:49%;width:2.7%;height:18%;border-radius:999px;background:linear-gradient(180deg,#6f9bff,#1f5fd6 40%,#123a86);"></div>
    <div style="position:absolute;left:43%;top:55%;width:2.9%;height:19%;border-radius:999px;background:linear-gradient(180deg,#6f9bff,#1f5fd6 40%,#123a86);"></div>

  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%, transparent 40%, rgba(0,0,0,.55) 100%);"></div>
  <div style="position:absolute;inset:0;background:#070b10;opacity:{{ dim }};"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:960,&quot;height&quot;:540},&quot;dim&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:0.9,&quot;step&quot;:0.05,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">

}
</script>
