<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="0 0 100 100" style="width:100%;height:100%;display:block;" aria-label="Your Own Commentator mark">
  <defs>
    <clipPath id="yocBall"><circle cx="54" cy="46" r="36"></circle></clipPath>
  </defs>
  <circle cx="54" cy="46" r="36" fill="{{ fill }}"></circle>
  <path d="M27 70 L14 92 L44 80 Z" fill="{{ fill }}"></path>
  <g clip-path="url(#yocBall)" fill="none" stroke="{{ ink }}" stroke-width="4.5" stroke-linecap="round">
    <path d="M18 46 H90"></path>
    <path d="M54 10 V82"></path>
    <path d="M30 17 C42 30 42 62 30 75"></path>
    <path d="M78 17 C66 30 66 62 78 75"></path>
  </g>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:200},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;accent&quot;,&quot;ink&quot;],&quot;default&quot;:&quot;accent&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fill&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFD400&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ink&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#070b10&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const mono = this.props.variant === 'ink';
    return { fill: mono ? '#070b10' : (this.props.fill ?? '#FFD400'), ink: mono ? '#FFD400' : (this.props.ink ?? '#070b10') };
  }
}
</script>
</body>
</html>
