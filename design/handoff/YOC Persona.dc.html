<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;height:100%;border-radius:22%;background:{{ bg }};display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(230,237,243,.14);">
  <svg viewBox="0 0 64 64" style="width:62%;height:62%;display:block;" fill="none" stroke="#e6edf3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <sc-if value="{{ isRookie }}" hint-placeholder-val="{{ false }}">
      <path d="M32 18 C26 14 18 13 9 14 V48 C18 47 26 48 32 52 C38 48 46 47 55 48 V14 C46 13 38 14 32 18 Z M32 18 V52"></path>
    </sc-if>
    <sc-if value="{{ isKid }}" hint-placeholder-val="{{ false }}">
      <path d="M32 7 L39.5 23.5 L57 25 L43.5 36.5 L47.5 54 L32 45 L16.5 54 L20.5 36.5 L7 25 L24.5 23.5 Z"></path>
      <path d="M27 31 V33 M37 31 V33"></path>
    </sc-if>
    <sc-if value="{{ isBooth }}" hint-placeholder-val="{{ false }}">
      <rect x="11" y="9" width="13" height="22" rx="6.5"></rect>
      <rect x="40" y="9" width="13" height="22" rx="6.5"></rect>
      <path d="M6 24 a11.5 11.5 0 0 0 23 0 M35 24 a11.5 11.5 0 0 0 23 0 M17.5 36 V50 M46.5 36 V50 M10 54 H25 M39 54 H54"></path>
    </sc-if>
    <sc-if value="{{ isFantasy }}" hint-placeholder-val="{{ false }}">
      <path d="M9 52 H55 M12 42 L24 31 L34 37 L51 18 M41 18 H51 V28"></path>
    </sc-if>
    <sc-if value="{{ isNovato }}" hint-placeholder-val="{{ false }}">
      <path d="M13 12 H51 a5 5 0 0 1 5 5 V39 a5 5 0 0 1 -5 5 H29 L18 54 V44 H13 a5 5 0 0 1 -5 -5 V17 a5 5 0 0 1 5 -5 Z"></path>
      <text x="32" y="36" text-anchor="middle" font-size="24" font-weight="800" fill="#e6edf3" stroke="none">Ñ</text>
    </sc-if>
    <sc-if value="{{ isHindi }}" hint-placeholder-val="{{ false }}">
      <text x="32" y="46" text-anchor="middle" font-size="40" font-weight="700" fill="#e6edf3" stroke="none">न</text>
      <path d="M8 12 H56"></path>
    </sc-if>
    <sc-if value="{{ isMandarin }}" hint-placeholder-val="{{ false }}">
      <text x="32" y="46" text-anchor="middle" font-size="38" font-weight="700" fill="#e6edf3" stroke="none">新</text>
      <circle cx="32" cy="33" r="27" stroke-width="3"></circle>
    </sc-if>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:160},&quot;persona&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;rookie&quot;,&quot;kid&quot;,&quot;booth&quot;,&quot;fantasy&quot;,&quot;novato&quot;,&quot;hindi&quot;,&quot;mandarin&quot;],&quot;default&quot;:&quot;rookie&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props.persona ?? 'rookie';
    const bg = { rookie:'oklch(0.36 0.06 240)', kid:'oklch(0.42 0.08 80)', booth:'oklch(0.34 0.06 295)', fantasy:'oklch(0.36 0.05 180)', novato:'oklch(0.37 0.07 30)', hindi:'oklch(0.36 0.06 330)', mandarin:'oklch(0.36 0.06 130)' }[p];
    return { bg, isRookie:p==='rookie', isKid:p==='kid', isBooth:p==='booth', isFantasy:p==='fantasy', isNovato:p==='novato', isHindi:p==='hindi', isMandarin:p==='mandarin' };
  }
}
</script>
</body>
</html>
