<!doctype html>
<!-- Push-to-talk phone page (C5). Serve over HTTPS (getUserMedia needs a secure context):
     https://<cdn>/talk-phone/index.html?ws=wss://<relay>  (locally: http://localhost:8000/?ws=ws://127.0.0.1:8765) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the Commentator</title>
<style>
  /* Same control-room palette as the TV app (app/src/theme.ts). */
  :root { color-scheme: dark; --bg: #070b10; --panel: #0c1218; --panel2: #111922; --line: #1c2733; --line2: #2a3847;
          --fg: #e6edf3; --dim: #8c99a8; --accent: #FFD400; --live: #3ddc84; --pink: #d6247a; --blue: #1f5fd6; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 18px 28px; background: radial-gradient(120% 60% at 50% 0%, #111a24 0%, var(--bg) 60%);
         color: var(--fg); font: 17px/1.45 system-ui, -apple-system, sans-serif; display: flex; flex-direction: column;
         gap: 14px; max-width: 480px; margin-inline: auto; min-height: 100dvh; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); margin: 0; }
  .teams { height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--pink) 50%, var(--blue) 50%); }
  h1 { font-size: 1.7rem; line-height: 1.15; margin: 2px 0 0; font-weight: 800; }
  form { display: flex; gap: 10px; }
  input { flex: 1; min-width: 0; font: 700 1.5rem/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .35em;
          text-transform: uppercase; text-align: center; padding: 14px 8px; border-radius: 14px; border: 2px solid var(--line);
          background: var(--panel); color: var(--fg); outline: none; }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: #4a5868; letter-spacing: .2em; }
  button { font: inherit; border: 0; border-radius: 14px; padding: 12px 18px; background: var(--panel2); color: var(--fg); }
  form button { background: var(--accent); color: #070b10; font-weight: 800; padding-inline: 22px; }
  #status { color: var(--dim); font-size: .92rem; min-height: 1.4em; display: flex; align-items: center; gap: 8px; }
  #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line2); flex: none; }
  body.joined #status::before { background: var(--live); box-shadow: 0 0 0 4px rgb(61 220 132 / .15); }
  .stage { flex: 1; display: grid; place-items: center; min-height: 42dvh; }
  #talk { width: min(70vw, 280px); aspect-ratio: 1; border-radius: 50%; font-size: 1.25rem; font-weight: 800;
          background: radial-gradient(circle at 50% 35%, #1a2532, var(--panel)); border: 3px solid var(--accent);
          box-shadow: 0 0 0 10px rgb(255 212 0 / .08), 0 20px 50px -20px #000; color: var(--fg);
          touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
          transition: transform .12s, box-shadow .2s, border-color .2s; padding: 24px; }
  #talk[aria-pressed="true"] { border-color: var(--live); transform: scale(.96); color: var(--live);
          animation: ring 1.1s ease-out infinite; }
  @keyframes ring { from { box-shadow: 0 0 0 0 rgb(61 220 132 / .45); } to { box-shadow: 0 0 0 28px rgb(61 220 132 / 0); } }
  #talk:disabled { border-color: var(--line2); box-shadow: none; color: #4a5868; }
  .said:empty, .ans:empty, #timing:empty { display: none; }
  .said { color: var(--dim); font-style: italic; }
  .ans { background: var(--panel); border: 2px solid var(--line); border-left: 5px solid var(--accent); border-radius: 14px;
         padding: 14px 16px; font-size: 1.1rem; }
  .ans::before { content: "Commentator"; display: block; font-size: 11px; font-weight: 700; letter-spacing: .18em;
         text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  #timing { color: #4a5868; font-size: .78rem; font-family: ui-monospace, Menlo, monospace; }
  @media (prefers-reduced-motion: reduce) { #talk { transition: none; } #talk[aria-pressed="true"] { animation: none; } }
</style>
</head>
<body>
<p class="eyebrow">Your Own Commentator · Fire TV</p>
<div class="teams" aria-hidden="true"></div>
<h1>Ask about the play on your TV</h1>
<form id="join">
  <input id="code" autocomplete="off" autocapitalize="characters" maxlength="6" pattern="[A-Za-z2-7]{6}" required
         placeholder="TV CODE" aria-label="6-character code shown on the TV">
  <button>Join</button>
</form>
<div id="status" role="status">Enter the code shown on your TV.</div>
<div class="stage"><button id="talk" disabled aria-pressed="false">Hold to ask</button></div>
<div class="said" id="said"></div>
<div class="ans" id="ans" aria-live="polite"></div>
<div id="timing"></div>
<script>
const WS = new URLSearchParams(location.search).get("ws");
const MAX_MS = 14500;  // C5 caps a question at 15 s; stop a little early so the last frames fit
const $ = id => document.getElementById(id);
const status = t => { $("status").textContent = t; };
const player = new Audio();
let ws, ctx, node, recording = false, sending = false, stopTimer, tStop;

// ponytail: box-filter downsample to 16 kHz (averages each output sample's input span), fine for speech ASR.
const WORKLET = `
class Down extends AudioWorkletProcessor {
  constructor() { super(); this.step = sampleRate / 16000; this.reset();
    this.port.onmessage = e => { if (e.data === "flush") { this.emit(); this.port.postMessage("flushed"); } else this.reset(); }; }
  reset() { this.pos = 0; this.acc = 0; this.n = 0; this.out = new Int16Array(512); this.k = 0; }
  emit() { if (this.k) this.port.postMessage(this.out.slice(0, this.k).buffer); this.out = new Int16Array(512); this.k = 0; }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      this.acc += ch[i]; this.n++;
      if (++this.pos >= this.step) {
        this.pos -= this.step;
        const v = this.acc / this.n; this.acc = 0; this.n = 0;
        this.out[this.k++] = Math.max(-32768, Math.min(32767, Math.round(v * 32767)));
        if (this.k === this.out.length) this.emit();  // 512 samples = 32 ms, 1 KB frames
      }
    }
    return true;
  }
}
registerProcessor("down", Down);`;

async function mic() {
  const stream = await navigator.mediaDevices.getUserMedia(
    { audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  ctx = new AudioContext();
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" })));
  node = new AudioWorkletNode(ctx, "down");
  node.port.onmessage = e => {
    if (!ws || ws.readyState !== 1) return;
    if (e.data === "flushed") { sending = false; ws.send(JSON.stringify({ type: "stop" })); tStop = performance.now(); status("Thinking..."); }
    else if (sending) ws.send(e.data);  // recording, or the last partial frame after release
  };
  ctx.createMediaStreamSource(stream).connect(node);  // not connected to the speakers: nothing is played back
}

$("join").onsubmit = async e => {
  e.preventDefault();
  const code = $("code").value.trim().toUpperCase();
  if (!WS || !/^wss?:\/\//.test(WS)) return status("This page needs ?ws=wss://... in its address.");
  try { if (!ctx) await mic(); } catch (err) { return status("Microphone blocked: " + err.message); }
  await ctx.resume();
  player.play().catch(() => {});  // unlocks audio playback on iOS inside this tap
  if (ws) ws.close();
  ws = new WebSocket(WS);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { ws.send(JSON.stringify({ type: "join", code })); $("talk").disabled = false; document.body.classList.add("joined"); status("Joined " + code + ". Hold the button and ask."); };
  ws.onclose = e => { $("talk").disabled = true; document.body.classList.remove("joined"); recording = sending = false; status("Disconnected" + (e.reason ? ": " + e.reason : "") + ". Join again."); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    const ms = Math.round(performance.now() - tStop);
    if (m.type === "transcript") {
      $("said").textContent = m.text ? "You asked: " + m.text : "Didn't catch that, try again.";
      $("timing").textContent = "transcript " + ms + " ms";
      if (!m.text) status("Hold the button and ask.");
    } else if (m.type === "answer") {
      $("ans").textContent = m.text;
      $("timing").textContent += ", answer " + ms + " ms";
      status("Hold the button and ask.");
      if (/^https:\/\//.test(m.audioUrl)) { player.src = m.audioUrl; player.play().catch(err => status("Tap to play: " + err.message)); }
    }
  };
};

player.onplaying = () => { if (tStop) $("timing").textContent += ", audio " + Math.round(performance.now() - tStop) + " ms"; tStop = 0; };

function start(e) {
  e.preventDefault();
  if (recording || $("talk").disabled) return;
  try { $("talk").setPointerCapture(e.pointerId); } catch {}  // keep pointerup if the thumb slides off (keys have no pointer)
  player.pause();
  recording = sending = true;
  node.port.postMessage("reset");
  ws.send(JSON.stringify({ type: "start" }));
  $("talk").setAttribute("aria-pressed", "true"); $("talk").textContent = "Listening… release to send";
  $("said").textContent = $("ans").textContent = $("timing").textContent = "";
  status("Listening");
  stopTimer = setTimeout(stop, MAX_MS);
}
function stop() {
  if (!recording) return;
  recording = false;
  clearTimeout(stopTimer);
  $("talk").setAttribute("aria-pressed", "false"); $("talk").textContent = "Hold to ask";
  node.port.postMessage("flush");  // last partial frame, then the "flushed" reply sends stop
}
const talk = $("talk");
talk.addEventListener("pointerdown", start);
["pointerup", "pointercancel"].forEach(t => talk.addEventListener(t, stop));
talk.addEventListener("contextmenu", e => e.preventDefault());
talk.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) start(e); });
talk.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") stop(); });
</script>
</body>
</html>
