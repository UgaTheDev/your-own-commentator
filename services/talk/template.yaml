AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Your Own Commentator talk-back relay (C4/C5): CloudFront (TLS on its default *.cloudfront.net cert, WebSocket
  pass-through) -> ALB on HTTP 80, reachable only from CloudFront -> one Fargate task. DesiredCount defaults to 0;
  scale to 1 only for demos. Sessions live in memory, so never run more than 1.

Parameters:
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Random value CloudFront sends as X-Origin-Secret; the ALB forwards only requests carrying it (blocks other distributions). Generate at deploy time; never commit.
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different AZs (the ALB needs two; the task gets a public IP, no NAT)
  ImageTag:
    Type: String
    Default: latest
  DesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]  # in-memory sessions: a TV and its phone must land on the same task
  MediaBucket:
    Type: String
    Default: yoc-media-817210752334
  CdnDomain:
    Type: String
    Default: d2og06dnam3owj.cloudfront.net

Rules:
  UsEast1Only:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: Nova 2 Sonic, the Nova 2 Lite us. profile and Polly generative voices are used from us-east-1

Resources:
  Repo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: yoc-talk
      EmptyOnDelete: true  # so delete-stack after demo day removes everything
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"keep 5","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: yoc-talk

  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /yoc/talk
      RetentionInDays: 7

  ExecutionRole:  # ECS agent: pull the image, write logs
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:  # the relay itself: exactly the four calls it makes
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              ArnLike: {"aws:SourceArn": !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:*"}
              StringEquals: {"aws:SourceAccount": !Ref "AWS::AccountId"}
      Policies:
        - PolicyName: talk
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SonicAsr
                Effect: Allow
                Action: [bedrock:InvokeModelWithBidirectionalStream, bedrock:InvokeModel]  # IAM also checks InvokeModel for the Sonic stream (AccessDenied without it)
                Resource: arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-2-sonic-v1:0
              - Sid: Nova2LiteAnswerAndJudge  # Converse is authorized as InvokeModel; the us. profile routes to 3 regions
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub arn:aws:bedrock:us-east-1:${AWS::AccountId}:inference-profile/us.amazon.nova-2-lite-v1:0
                  - arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-2-lite-v1:0
                  - arn:aws:bedrock:us-east-2::foundation-model/amazon.nova-2-lite-v1:0
                  - arn:aws:bedrock:us-west-2::foundation-model/amazon.nova-2-lite-v1:0
              - Sid: Voice
                Effect: Allow
                Action: polly:SynthesizeSpeech
                Resource: "*"  # Polly has no resource-level scoping for SynthesizeSpeech
              - Sid: PublishAnswerAudio  # bucket is SSE-S3 (AES256), so no KMS permission is needed
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::${MediaBucket}/published/talk/*

  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: yoc-talk ALB, HTTP from CloudFront origin-facing addresses only
      VpcId: !Ref VpcId
      SecurityGroupIngress:  # AWS-managed prefix list com.amazonaws.global.cloudfront.origin-facing (us-east-1)
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, SourcePrefixListId: pl-3b927c52}

  TaskSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: yoc-talk task, relay port from the ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8765, ToPort: 8765, SourceSecurityGroupId: !Ref AlbSg}

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: yoc-talk
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSg]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: "300"}  # the phone can sit quiet between questions
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: "true"}

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8765
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: "5"}

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP  # CloudFront terminates TLS; this hop stays inside AWS's network
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: "403", ContentType: text/plain, MessageBody: forbidden}

  OriginSecretRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig: {HttpHeaderName: X-Origin-Secret, Values: [!Ref OriginSecret]}
      Actions:
        - {Type: forward, TargetGroupArn: !Ref TargetGroup}

  TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: yoc-talk
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: talk
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/yoc-talk:${ImageTag}
          Essential: true
          PortMappings: [{ContainerPort: 8765, Protocol: tcp}]
          Environment:
            - {Name: YOC_BUCKET, Value: !Ref MediaBucket}
            - {Name: YOC_CDN, Value: !Ref CdnDomain}
            - {Name: YOC_PROXY_HOPS, Value: "2"}  # XFF ends '<viewer>, <edge>': rate-limit joins by the viewer
            - {Name: AWS_REGION, Value: us-east-1}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: talk

  Cdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: yoc-talk relay (WebSocket)
        PriceClass: PriceClass_100
        Origins:
          - Id: alb
            DomainName: !GetAtt Alb.DNSName
            OriginCustomHeaders:
              - {HeaderName: X-Origin-Secret, HeaderValue: !Ref OriginSecret}
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]  # a WebSocket upgrade is a GET
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3  # Managed-AllViewer (keeps Upgrade headers)
          Compress: false

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: yoc-talk
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDef
      DesiredCount: !Ref DesiredCount
      DeploymentConfiguration: {MinimumHealthyPercent: 0, MaximumPercent: 100}  # never two tasks at once
      HealthCheckGracePeriodSeconds: 30
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED  # outbound to ECR/Bedrock/Polly/S3 without a NAT gateway; inbound only via TaskSg
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSg]
      LoadBalancers:
        - {ContainerName: talk, ContainerPort: 8765, TargetGroupArn: !Ref TargetGroup}

Outputs:
  RepoUri:
    Value: !GetAtt Repo.RepositoryUri
  WssUrl:
    Description: C5/C4 endpoint for the phone page (?ws=) and the TV app manifest
    Value: !Sub wss://${Cdn.DomainName}
  PhonePageUrl:
    Description: after uploading phone/index.html to published/talk-phone/ (see deploy.md)
    Value: !Sub https://${CdnDomain}/talk-phone/index.html?ws=wss://${Cdn.DomainName}
